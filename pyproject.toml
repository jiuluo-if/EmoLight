[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emolight"
version = "0.1.0"
description = "Offline acoustic emotion lighting prototype with explicit simulation mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.5", "joblib>=1.3"]
audio = ["sounddevice>=0.4"]
ml = ["scikit-learn>=1.5", "joblib>=1.3", "psutil>=5.9"]

[project.scripts]
emolight = "emolight.cli:main"
emolight-train = "emolight.training.train_svm:main"
emolight-evaluate = "emolight.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
